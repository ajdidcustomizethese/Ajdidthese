<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJDidThese | Customer Ratings</title>

<style>
/* =========================================================
   AJDIDTHESE CUSTOMER RATINGS
   COMPLETE ONE-FILE VERSION
   ========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #ffffff;
    color: #0a0a0a;
    font-family: Arial, Helvetica, sans-serif;
}

/* ================= TOP BAR ================= */

.topbar {
    height: 72px;
    background: #0b0b0b;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.brand span {
    color: #f2c94c;
}

.back-button {
    color: white;
    text-decoration: none;

    border: 1px solid white;
    border-radius: 8px;

    padding: 11px 16px;

    font-size: 12px;
    font-weight: 900;

    transition: 0.2s ease;
}

.back-button:hover {
    background: white;
    color: black;
}

/* ================= MAIN ================= */

.container {
    width: min(1120px, 92%);
    margin: auto;

    padding: 50px 0 80px;
}

/* ================= HEADER ================= */

.hero {
    text-align: center;
    margin-bottom: 40px;
}

.kicker {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;

    margin-bottom: 12px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(38px, 6vw, 64px);

    letter-spacing: -3px;
    line-height: 1;
}

.subtitle {
    max-width: 650px;

    margin: 15px auto 0;

    color: #666;

    font-size: 15px;
    line-height: 1.6;
}

/* ================= RATING BOX ================= */

.rating-overview {
    background: #0b0b0b;
    color: white;

    border-radius: 22px;

    padding: 32px;

    display: grid;

    grid-template-columns: 280px 1fr;

    gap: 30px;

    align-items: center;

    margin-bottom: 45px;
}

.big-rating {
    text-align: center;

    border-right: 1px solid #333;

    padding-right: 30px;
}

.big-number {
    font-size: 60px;

    line-height: 1;

    font-weight: 950;
}

.big-stars {
    font-size: 24px;

    letter-spacing: 2px;

    margin: 10px 0 5px;
}

.rating-count {
    color: #bcbcbc;

    font-size: 14px;
}

/* ================= BREAKDOWN ================= */

.breakdown {
    display: grid;

    gap: 12px;
}

.bar-row {
    display: grid;

    grid-template-columns: 25px 1fr 35px;

    align-items: center;

    gap: 10px;

    font-size: 13px;

    font-weight: 800;
}

.rating-bar {
    height: 8px;

    background: #333;

    border-radius: 100px;

    overflow: hidden;
}

.rating-fill {
    height: 100%;

    background: white;

    border-radius: 100px;

    transition: width 0.5s ease;
}

/* ================= REVIEWS HEADER ================= */

.review-controls {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 22px;
}

.review-controls h2 {
    margin: 0;

    font-size: 27px;
}

/* ================= FILTERS ================= */

.filters {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.filter-button {
    border: 1px solid #d0d0d0;

    background: white;

    color: black;

    padding: 9px 14px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: 900;

    cursor: pointer;

    transition: 0.2s ease;
}

.filter-button:hover,
.filter-button.active {
    background: black;

    color: white;

    border-color: black;
}

/* ================= REVIEW GRID ================= */

.review-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 16px;
}

/* ================= REVIEW CARD ================= */

.review-card {
    background: white;

    border: 1px solid #dedede;

    border-radius: 17px;

    padding: 21px;

    transition: 0.25s ease;
}

.review-card:hover {
    transform: translateY(-4px);

    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.review-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.person {
    display: flex;

    align-items: center;

    gap: 12px;
}

.avatar {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    background: black;

    color: white;

    display: grid;

    place-items: center;

    font-size: 13px;

    font-weight: 900;

    flex-shrink: 0;
}

.name {
    font-size: 14px;

    font-weight: 900;
}

.customer-label {
    color: #777;

    font-size: 11px;

    font-weight: 700;

    margin-top: 3px;
}

.review-date {
    color: #888;

    font-size: 11px;

    white-space: nowrap;
}

/* ================= STARS ================= */

.review-stars {
    margin: 16px 0 10px;

    font-size: 17px;

    letter-spacing: 1px;
}

/* ================= REVIEW TEXT ================= */

.review-text {
    margin: 0 0 18px;

    font-size: 14px;

    line-height: 1.65;

    color: #222;
}

/* ================= PRODUCT TAG ================= */

.product-tag {
    display: inline-block;

    background: #f5f5f5;

    border: 1px solid #ddd;

    border-radius: 999px;

    padding: 7px 10px;

    font-size: 11px;

    font-weight: 900;
}

/* ================= EMPTY ================= */

.empty-reviews {
    border: 1px dashed #ccc;

    border-radius: 17px;

    padding: 50px 20px;

    text-align: center;

    color: #777;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;

    color: #888;

    font-size: 12px;

    border-top: 1px solid #eee;

    padding-top: 25px;

    margin-top: 60px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .topbar {
        height: 62px;

        padding: 0 4%;
    }

    .brand {
        font-size: 17px;
    }

    .back-button {
        font-size: 10px;

        padding: 9px 11px;
    }

    .container {
        width: 94%;

        padding-top: 35px;
    }

    .hero h1 {
        font-size: 42px;

        letter-spacing: -2px;
    }

    .subtitle {
        font-size: 13px;
    }

    .rating-overview {
        grid-template-columns: 1fr;

        padding: 23px;

        gap: 25px;
    }

    .big-rating {
        border-right: none;

        border-bottom: 1px solid #333;

        padding-right: 0;

        padding-bottom: 25px;
    }

    .big-number {
        font-size: 54px;
    }

    .review-controls {
        flex-direction: column;

        align-items: flex-start;
    }

    .review-controls h2 {
        font-size: 23px;
    }

    .review-grid {
        grid-template-columns: 1fr;
    }

    .review-card {
        padding: 18px;
    }
}

@media (max-width: 430px) {

    .topbar {
        padding: 0 12px;
    }

    .brand {
        font-size: 15px;
    }

    .back-button {
        padding: 8px 9px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .rating-overview {
        border-radius: 17px;
    }

    .big-number {
        font-size: 48px;
    }

    .review-top {
        align-items: flex-start;
    }

    .review-date {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     TOP BAR
     ========================================================= -->

<header class="topbar">

    <div class="brand">
        AJDidThese <span>★</span>
    </div>

    <a href="index.html" class="back-button">
        ← BACK TO STORE
    </a>

</header>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container">


    <!-- HEADER -->

    <section class="hero">

        <div class="kicker">
            AJDIDTHESE • CUSTOMER FEEDBACK
        </div>

        <h1>
            Customer Ratings
        </h1>

        <p class="subtitle">
            See what people are saying about the custom sneaker collection.
        </p>

    </section>


    <!-- =====================================================
         RATING OVERVIEW
         ===================================================== -->

    <section class="rating-overview">

        <div class="big-rating">

            <div
                class="big-number"
                id="averageRating">
                4.5
            </div>

            <div
                class="big-stars"
                id="averageStars">
                ★★★★★
            </div>

            <div class="rating-count">

                <span id="ratingCount">
                    100
                </span>

                ratings

            </div>

        </div>


        <div
            class="breakdown"
            id="ratingBreakdown">

        </div>

    </section>


    <!-- =====================================================
         REVIEWS HEADER
         ===================================================== -->

    <section>

        <div class="review-controls">

            <h2>
                Customer Reviews
            </h2>

            <div class="filters">

                <button
                    class="filter-button active"
                    data-rating="all">
                    All
                </button>

                <button
                    class="filter-button"
                    data-rating="5">
                    5 ★
                </button>

                <button
                    class="filter-button"
                    data-rating="4">
                    4 ★
                </button>

                <button
                    class="filter-button"
                    data-rating="3">
                    3 ★
                </button>

            </div>

        </div>


        <!-- REVIEWS WILL APPEAR HERE -->

        <div
            class="review-grid"
            id="reviewGrid">
        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        AJDidThese ★ Custom sneakers &amp; limited releases

    </footer>

</main>


<!-- =========================================================
     JAVASCRIPT
     EVERYTHING BELOW IS INCLUDED IN THIS ONE HTML FILE
     ========================================================= -->

<script>

/* =========================================================
   REVIEW DATA
   ========================================================= */

/*
   100 total reviews

   60 = 5 stars
   30 = 4 stars
   10 = 3 stars

   Average:

   (60×5 + 30×4 + 10×3) ÷ 100 = 4.5
*/


const names = [

    "Jayden R.",
    "Malik T.",
    "Chris M.",
    "Dylan W.",
    "Andre P.",
    "Jordan K.",
    "Cameron B.",
    "Isaiah L.",
    "Noah S.",
    "Marcus H.",
    "Ethan C.",
    "Tyler J.",
    "Aiden G.",
    "Devin F.",
    "Jalen D.",
    "Mason V.",
    "Kobe N.",
    "Elijah P.",
    "Brandon S.",
    "Caleb R.",
    "Trey W.",
    "Damian C.",
    "Xavier M.",
    "Jaylen B.",
    "Micah T."

];


const products = [

    "Itachi JA 4s",
    "Mario JA Morants",
    "Chrome Nike Slides",
    "One Piece JA 3s",
    "Black & White JA 3s",
    "Custom JA Cleats",
    "Naruto JA 3s",
    "Special Edition JA 4s"

];


const fiveStarReviews = [

    "These came out way better than I expected. The details are crazy.",

    "Really clean pair. The pictures looked good but they look even better in person.",

    "The custom work is fire and the shoes feel solid. Definitely happy with them.",

    "Love how these turned out. The little details make the whole pair stand out.",

    "Honestly one of my favorite pairs right now. Super clean.",

    "The design came out exactly how I wanted it. Would definitely order again.",

    "These look amazing in person. The black and white setup goes with everything.",

    "Very happy with the final pair. The custom details are what sold me.",

    "The shoes look way better than I expected. Definitely a unique pair.",

    "Clean work all around. The design has a lot of detail without looking messy.",

    "The pair is crazy in person. Pictures really don't show all the details.",

    "I really like how the colors came together. Super clean custom.",

    "These are easily one of the coolest pairs I've seen.",

    "The design is hard. Everything came together really well.",

    "Very clean pair and the custom work makes them stand out.",

    "The details are probably my favorite part. Looks great on foot.",

    "I was really impressed with how these turned out.",

    "The whole pair looks clean from every angle.",

    "Definitely happy with these. The design is unique without being too much.",

    "These came out fire. I would definitely get another custom pair."

];


const fourStarReviews = [

    "Really like the shoes. A couple tiny things could be cleaner, but overall they're fire.",

    "Good quality and a really cool design. Happy with how they turned out.",

    "The pair looks great and the details are nice. Definitely worth checking out.",

    "Very solid custom. The design is clean and they look good on foot.",

    "I like these a lot. The colors and details came together really well.",

    "Good experience overall and the shoes came out looking really clean.",

    "The custom design looks great. There are just a few small details I'd change.",

    "Really happy with the pair overall. The design is definitely the best part.",

    "These look good and the details are nice. Very solid custom pair.",

    "The shoes came out really clean. I'd probably order another design.",

    "Good looking pair. The custom details make them stand out.",

    "I like the final look a lot. Just a few small things could be improved.",

    "Pretty clean custom and the design is really cool.",

    "The pair looks great in person. Definitely a unique design.",

    "Overall really happy with them. The details are nice.",

    "The design is clean and they look good on foot.",

    "Really nice pair. I like the attention to detail.",

    "The shoes look great and the custom style is different from anything I have.",

    "Solid pair overall. The design came together really well.",

    "Very cool custom. Would definitely consider another pair."

];


const threeStarReviews = [

    "The design is cool and the shoes look good. I just expected a little more detail.",

    "Pretty good overall. There are a few small things I would change on another pair.",

    "I like the concept and the shoes look nice. Some details could be a little cleaner.",

    "The idea is really cool. I think a little more attention to the smaller details would help.",

    "The shoes look good overall, but I expected the custom work to be a little more detailed.",

    "Cool design and good concept. There are a couple things I'd improve.",

    "The pair is nice but some of the smaller details could be cleaner.",

    "I like the style. The finished pair just wasn't exactly what I expected.",

    "Good concept and decent overall look. I think the design could be polished a little more.",

    "The shoes are cool and unique. I'd just make a few changes to the details."

];


const dates = [

    "Aug 28, 2026",
    "Aug 24, 2026",
    "Aug 19, 2026",
    "Aug 14, 2026",
    "Aug 9, 2026",
    "Aug 3, 2026",
    "Jul 29, 2026",
    "Jul 24, 2026",
    "Jul 18, 2026",
    "Jul 12, 2026",
    "Jul 7, 2026",
    "Jun 30, 2026"

];


/* =========================================================
   CREATE 100 REVIEWS
   ========================================================= */

const reviews = [];


/*
   60 five-star reviews
*/

for (let i = 0; i < 60; i++) {

    reviews.push({

        name: names[i % names.length],

        rating: 5,

        product: products[i % products.length],

        date: dates[i % dates.length],

        text: fiveStarReviews[i % fiveStarReviews.length]

    });

}


/*
   30 four-star reviews
*/

for (let i = 0; i < 30; i++) {

    reviews.push({

        name: names[(i + 10) % names.length],

        rating: 4,

        product: products[(i + 2) % products.length],

        date: dates[(i + 3) % dates.length],

        text: fourStarReviews[i % fourStarReviews.length]

    });

}


/*
   10 three-star reviews
*/

for (let i = 0; i < 10; i++) {

    reviews.push({

        name: names[(i + 15) % names.length],

        rating: 3,

        product: products[(i + 4) % products.length],

        date: dates[(i + 5) % dates.length],

        text: threeStarReviews[i % threeStarReviews.length]

    });

}


/* =========================================================
   STAR FUNCTION
   ========================================================= */

function getStars(rating) {

    let result = "";

    for (let i = 1; i <= 5; i++) {

        if (i <= rating) {

            result += "★";

        } else {

            result += "☆";

        }

    }

    return result;

}


/* =========================================================
   GET INITIALS
   ========================================================= */

function getInitials(name) {

    return name
        .replace(".", "")
        .split(" ")
        .map(word => word.charAt(0))
        .slice(0, 2)
        .join("")
        .toUpperCase();

}


/* =========================================================
   CALCULATE AVERAGE
   ========================================================= */

function calculateAverage() {

    let total = 0;

    reviews.forEach(review => {

        total += review.rating;

    });

    return total / reviews.length;

}


/* =========================================================
   UPDATE MAIN RATING
   ========================================================= */

function updateMainRating() {

    const average = calculateAverage();

    document.getElementById("averageRating").textContent =
        average.toFixed(1);

    document.getElementById("ratingCount").textContent =
        reviews.length;

    document.getElementById("averageStars").textContent =
        "★★★★★";

}


/* =========================================================
   CREATE RATING BREAKDOWN
   ========================================================= */

function createBreakdown() {

    const breakdown =
        document.getElementById("ratingBreakdown");

    const counts = {

        5: 0,
        4: 0,
        3: 0,
        2: 0,
        1: 0

    };


    reviews.forEach(review => {

        counts[review.rating]++;

    });


    breakdown.innerHTML = "";


    for (let rating = 5; rating >= 1; rating--) {

        const percentage =
            (counts[rating] / reviews.length) * 100;


        const row =
            document.createElement("div");

        row.className = "bar-row";


        row.innerHTML = `

            <span>${rating}</span>

            <div class="rating-bar">

                <div
                    class="rating-fill"
                    style="width:${percentage}%">
                </div>

            </div>

            <span>${counts[rating]}</span>

        `;


        breakdown.appendChild(row);

    }

}


/* =========================================================
   CREATE REVIEW CARD
   ========================================================= */

function createReviewCard(review) {

    const card =
        document.createElement("article");

    card.className = "review-card";


    card.innerHTML = `

        <div class="review-top">

            <div class="person">

                <div class="avatar">
                    ${getInitials(review.name)}
                </div>

                <div>

                    <div class="name">
                        ${review.name}
                    </div>

                    <div class="customer-label">
                        Customer Review
                    </div>

                </div>

            </div>


            <div class="review-date">
                ${review.date}
            </div>

        </div>


        <div
            class="review-stars"
            aria-label="${review.rating} out of 5 stars">

            ${getStars(review.rating)}

        </div>


        <p class="review-text">
            ${review.text}
        </p>


        <span class="product-tag">
            ${review.product}
        </span>

    `;


    return card;

}


/* =========================================================
   DISPLAY REVIEWS
   ========================================================= */

function displayReviews(filter = "all") {

    const grid =
        document.getElementById("reviewGrid");


    grid.innerHTML = "";


    let filteredReviews;


    if (filter === "all") {

        filteredReviews = reviews;

    } else {

        filteredReviews =
            reviews.filter(
                review =>
                    review.rating === Number(filter)
            );

    }


    if (filteredReviews.length === 0) {

        grid.innerHTML = `

            <div class="empty-reviews">

                No reviews found for this rating.

            </div>

        `;

        return;

    }


    filteredReviews.forEach(review => {

        grid.appendChild(
            createReviewCard(review)
        );

    });

}


/* =========================================================
   FILTER BUTTONS
   ========================================================= */

const filterButtons =
    document.querySelectorAll(".filter-button");


filterButtons.forEach(button => {

    button.addEventListener("click", function() {


        filterButtons.forEach(btn => {

            btn.classList.remove("active");

        });


        this.classList.add("active");


        const rating =
            this.getAttribute("data-rating");


        displayReviews(rating);

    });

});


/* =========================================================
   START EVERYTHING
   ========================================================= */

updateMainRating();

createBreakdown();

displayReviews("all");


/* =========================================================
   CONSOLE CHECK
   ========================================================= */

console.log(
    "AJDidThese Reviews Loaded:",
    reviews.length
);

console.log(
    "Average Rating:",
    calculateAverage().toFixed(1)
);

</script>

</body>
</html>
