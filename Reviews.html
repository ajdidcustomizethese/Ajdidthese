   ========================================================= */

* {

}

html {

}

body {

    background: #ffffff;
    color: #0a0a0a;
    font-family: Arial, Helvetica, sans-serif;
}

/* ================= TOP BAR ================= */

.topbar {
    height: 72px;
    background: #0b0b0b;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.brand span {
    color: #f2c94c;
}

.back-button {
    color: white;
    text-decoration: none;

    border: 1px solid white;
    border-radius: 8px;

    padding: 11px 16px;

    font-size: 12px;
    font-weight: 900;

    transition: 0.2s ease;
}

.back-button:hover {
    background: white;
    color: black;
}

/* ================= MAIN ================= */

.container {
    width: min(1120px, 92%);
    margin: auto;

    padding: 50px 0 80px;
}

/* ================= HEADER ================= */

.hero {
    text-align: center;
    margin-bottom: 40px;
}

.kicker {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;

    margin-bottom: 12px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(38px, 6vw, 64px);

    letter-spacing: -3px;
    line-height: 1;
}

.subtitle {
    max-width: 650px;

    margin: 15px auto 0;

    color: #666;

    font-size: 15px;
    line-height: 1.6;
}

/* ================= RATING BOX ================= */

.rating-overview {
    background: #0b0b0b;
    color: white;

    border-radius: 22px;

    padding: 32px;

    display: grid;

    grid-template-columns: 280px 1fr;

    gap: 30px;

    align-items: center;

    margin-bottom: 45px;
}

.big-rating {
    text-align: center;

    border-right: 1px solid #333;

    padding-right: 30px;
}

.big-number {
    font-size: 60px;

    line-height: 1;

    font-weight: 950;
}

.big-stars {
    font-size: 24px;

    letter-spacing: 2px;

    margin: 10px 0 5px;
}

.rating-count {
    color: #bcbcbc;

    font-size: 14px;
}

/* ================= BREAKDOWN ================= */

.breakdown {
    display: grid;

    gap: 12px;
}

.bar-row {
    display: grid;

    grid-template-columns: 25px 1fr 35px;

    align-items: center;

    gap: 10px;

    font-size: 13px;

    font-weight: 800;
}

.rating-bar {
    height: 8px;

    background: #333;

    border-radius: 100px;

    overflow: hidden;
}

.rating-fill {
    height: 100%;

    background: white;

    border-radius: 100px;

    transition: width 0.5s ease;
}

/* ================= REVIEWS HEADER ================= */

.review-controls {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 22px;
}

.review-controls h2 {
    margin: 0;

    font-size: 27px;
}

/* ================= FILTERS ================= */

.filters {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.filter-button {
    border: 1px solid #d0d0d0;

    background: white;

    color: black;

    padding: 9px 14px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: 900;

    cursor: pointer;

    transition: 0.2s ease;
}

.filter-button:hover,
.filter-button.active {
    background: black;

    color: white;

    border-color: black;
}

/* ================= REVIEW GRID ================= */

.review-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 16px;
}

/* ================= REVIEW CARD ================= */

.review-card {
    background: white;

    border: 1px solid #dedede;

    border-radius: 17px;

    padding: 21px;

    transition: 0.25s ease;
}

.review-card:hover {
    transform: translateY(-4px);

    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.review-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.person {
    display: flex;

    align-items: center;

    gap: 12px;
}

.avatar {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    background: black;

    color: white;

    display: grid;

    place-items: center;

    font-size: 13px;

    font-weight: 900;

    flex-shrink: 0;
}

.name {
    font-size: 14px;

    font-weight: 900;
}

.customer-label {
    color: #777;

    font-size: 11px;

    font-weight: 700;

    margin-top: 3px;
}

.review-date {
    color: #888;

    font-size: 11px;

    white-space: nowrap;
}

/* ================= STARS ================= */

.review-stars {
    margin: 16px 0 10px;

    font-size: 17px;

    letter-spacing: 1px;
}

/* ================= REVIEW TEXT ================= */

.review-text {
    margin: 0 0 18px;

    font-size: 14px;

    line-height: 1.65;

    color: #222;
}

/* ================= PRODUCT TAG ================= */

.product-tag {
    display: inline-block;

    background: #f5f5f5;

    border: 1px solid #ddd;

    border-radius: 999px;

    padding: 7px 10px;

    font-size: 11px;

    font-weight: 900;
}

/* ================= EMPTY ================= */

.empty-reviews {
    border: 1px dashed #ccc;

    border-radius: 17px;

    padding: 50px 20px;

    text-align: center;

    color: #777;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;

    color: #888;

    font-size: 12px;

    border-top: 1px solid #eee;

    padding-top: 25px;

    margin-top: 60px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .topbar {
        height: 62px;

        padding: 0 4%;
    }

    .brand {
        font-size: 17px;
    }

    .back-button {
        font-size: 10px;

        padding: 9px 11px;
    }

    .container {
        width: 94%;

        padding-top: 35px;
    }

    .hero h1 {
        font-size: 42px;

        letter-spacing: -2px;
    }

    .subtitle {
        font-size: 13px;
    }

    .rating-overview {
        grid-template-columns: 1fr;

        padding: 23px;

        gap: 25px;
    }

    .big-rating {
        border-right: none;

        border-bottom: 1px solid #333;

        padding-right: 0;

        padding-bottom: 25px;
    }

    .big-number {
        font-size: 54px;
    }

    .review-controls {
        flex-direction: column;

        align-items: flex-start;
    }

    .review-controls h2 {
        font-size: 23px;
    }

    .review-grid {
        grid-template-columns: 1fr;
    }

    .review-card {
        padding: 18px;
    }
}

@media (max-width: 430px) {

    .topbar {
        padding: 0 12px;
    }

    .brand {
        font-size: 15px;
    }

    .back-button {
        padding: 8px 9px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .rating-overview {
        border-radius: 17px;
    }

    .big-number {
        font-size: 48px;
    }

    .review-top {
        align-items: flex-start;
    }

    .review-date {
        font-size: 10px;
    }
}

/* =========================================================
   STAR FUNCTION
   ========================================================= */

function getStars(rating) {

    let result = "";

    for (let i = 1; i <= 5; i++) {

        if (i <= rating) {

            result += "★";

        } else {

            result += "☆";

        }

    }

    return result;

}


/* =========================================================
   GET INITIALS
   ========================================================= */

function getInitials(name) {

    return name
        .replace(".", "")
        .split(" ")
        .map(word => word.charAt(0))
        .slice(0, 2)
        .join("")
        .toUpperCase();

}


/* =========================================================
   CALCULATE AVERAGE
   ========================================================= */

function calculateAverage() {

    let total = 0;

    reviews.forEach(review => {

        total += review.rating;

    });

    return total / reviews.length;

}


/* =========================================================
   UPDATE MAIN RATING
   ========================================================= */

function updateMainRating() {

    const average = calculateAverage();

    document.getElementById("averageRating").textContent =
        average.toFixed(1);

    document.getElementById("ratingCount").textContent =
        reviews.length;

    document.getElementById("averageStars").textContent =
        "★★★★★";

}


/* =========================================================
   CREATE RATING BREAKDOWN
   ========================================================= */

function createBreakdown() {

    const breakdown =
        document.getElementById("ratingBreakdown");

    const counts = {

        5: 0,
        4: 0,
        3: 0,
        2: 0,
        1: 0

    };


    reviews.forEach(review => {

        counts[review.rating]++;

    });


    breakdown.innerHTML = "";


    for (let rating = 5; rating >= 1; rating--) {

        const percentage =
            (counts[rating] / reviews.length) * 100;


        const row =
            document.createElement("div");

        row.className = "bar-row";


        row.innerHTML = `

            <span>${rating}</span>

            <div class="rating-bar">

                <div
                    class="rating-fill"
                    style="width:${percentage}%">
                </div>

            </div>

            <span>${counts[rating]}</span>

        `;


        breakdown.appendChild(row);

    }

}


/* =========================================================
   CREATE REVIEW CARD
   ========================================================= */

function createReviewCard(review) {

    const card =
        document.createElement("article");

    card.className = "review-card";


    card.innerHTML = `

        <div class="review-top">

            <div class="person">

                <div class="avatar">
                    ${getInitials(review.name)}
                </div>

                <div>

                    <div class="name">
                        ${review.name}
                    </div>

                    <div class="customer-label">
                        Customer Review
                    </div>

                </div>

            </div>


            <div class="review-date">
                ${review.date}
            </div>

        </div>


        <div
            class="review-stars"
            aria-label="${review.rating} out of 5 stars">

            ${getStars(review.rating)}

        </div>


        <p class="review-text">
            ${review.text}
        </p>


        <span class="product-tag">
            ${review.product}
        </span>

    `;


    return card;

}


/* =========================================================
   DISPLAY REVIEWS
   ========================================================= */

function displayReviews(filter = "all") {

    const grid =
        document.getElementById("reviewGrid");


    grid.innerHTML = "";


    let filteredReviews;


    if (filter === "all") {

        filteredReviews = [...reviews];

    } else {

        filteredReviews =
            reviews.filter(
                review =>
                    review.rating === Number(filter)
            );

    }

    const sort = document.getElementById("sortReviews")?.value || "newest";

    if (sort === "highest") {
        filteredReviews.sort((a, b) => b.rating - a.rating);
    } else if (sort === "lowest") {
        filteredReviews.sort((a, b) => a.rating - b.rating);
    }


    if (filteredReviews.length === 0) {

        grid.innerHTML = `

            <div class="empty-reviews">

                No reviews found for this rating.

            </div>

        `;

        return;

    }


    filteredReviews.forEach(review => {

        grid.appendChild(
            createReviewCard(review)
        );

    });

}


/* =========================================================
   FILTER BUTTONS
   ========================================================= */

const filterButtons =
    document.querySelectorAll(".filter-button");


filterButtons.forEach(button => {

    button.addEventListener("click", function() {


        filterButtons.forEach(btn => {

            btn.classList.remove("active");

        });


        this.classList.add("active");


        const rating =
            this.getAttribute("data-rating");


        displayReviews(rating);

    });

});
