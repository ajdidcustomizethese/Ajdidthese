<style>

function ajdStars(rating) {
  return "★".repeat(rating) + "☆".repeat(5 - rating);
}

function ajdDate(index) {
  const date = new Date();
  date.setDate(date.getDate() - (index * 2 + 3));

  return date.toLocaleDateString("en-US", {
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function renderAJReviews(filter = "all") {

  const grid = document.getElementById("ajdReviewGrid");

  if (!grid) return;

  grid.innerHTML = "";

  ajdReviews.forEach((review, index) => {

    const name = review[0];
    const rating = review[1];
    const product = review[2];
    const text = review[3];

    if (filter !== "all" && rating !== Number(filter)) {
      return;
    }

    const initials = name
      .split(" ")
      .map(part => part[0])
      .join("")
      .substring(0,2);

    const card = document.createElement("div");
    card.className = "ajd-review-card";

    card.innerHTML = `
      <div class="ajd-review-top">

        <div class="ajd-review-user">

          <div class="ajd-avatar">
            ${initials}
          </div>

          <div>
            <div class="ajd-review-name">
              ${name}
            </div>

            <div class="ajd-review-date">
              ${ajdDate(index)}
            </div>
          </div>

        </div>

        <div class="ajd-review-stars">
          ${ajdStars(rating)}
        </div>

      </div>

      <div class="ajd-review-product">
        ${product}
      </div>

      <div class="ajd-review-text">
        ${text}
      </div>

      <div class="ajd-verified">
        ✓ Verified Purchase
      </div>

      <div class="ajd-review-footer">
        Helpful • Was this review helpful?
      </div>
    `;

    grid.appendChild(card);
  });
}

function filterAJReviews(value) {
  renderAJReviews(value);
}

function openAJReviews() {
  const overlay = document.getElementById("ajdReviewsOverlay");

  if (overlay) {
    overlay.classList.add("active");
    document.body.style.overflow = "hidden";
    renderAJReviews();
  }
}

function closeAJReviews() {
  const overlay = document.getElementById("ajdReviewsOverlay");

  if (overlay) {
    overlay.classList.remove("active");
    document.body.style.overflow = "";
  }
}

/* Close when clicking outside the reviews box */
document.getElementById("ajdReviewsOverlay")?.addEventListener("click", function(e) {
  if (e.target === this) {
    closeAJReviews();
  }
});

/* ESC key closes reviews */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeAJReviews();
  }
});

/* Connect Reviews navigation button */
document.addEventListener("DOMContentLoaded", function() {

  const reviewsLink = document.getElementById("reviewsNavLink");

  if (reviewsLink) {

    reviewsLink.addEventListener("click", function(e) {
      e.preventDefault();
      openAJReviews();
    });

});
