<!DOCTYPE html>
<html>
<head>
<title>Slides | AJDidThese</title>

<style>

h1{

}

.product img{

height:220px;

}

.product h3{
margin-top:15px;
}

</style>

</head>
<body>

<h1>🩴 Slides Collection 🩴</h1>

<p class="old">$70</p>
<p class="price">$50</p>

</html>
